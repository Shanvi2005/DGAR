version: '3.7'

services:
  neo4j:
    image: neo4j:latest 
    hostname: neo4j
    container_name: neo4j_dgar
    restart: always
    
    ports:
      - "7474:7474"
      - "7687:7687" 

    environment:
    
      NEO4J_AUTH: none 

      NEO4J_dbms_connector_bolt_tls__level: DISABLED 

      NEO4J_dbms_connector_bolt_listen__address: 0.0.0.0:7687

      NEO4J_dbms_memory_heap_initial__size: "256M"
      NEO4J_dbms_memory_heap_max__size: "512M"
      
      NEO4J_PLUGINS: '["apoc"]'
      
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
